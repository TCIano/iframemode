<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>技术文档</title>
    <style>
      :root { --ink: #112b46; --accent: #0f4c70; --paper: #fbf7ed; --line: #d9cfbd; --muted: #6f6a61; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #e7e0d2; color: #252525; font: 17px/1.9 Georgia, "Noto Serif SC", "Songti SC", SimSun, serif; }
      .sheet { width: min(920px, calc(100% - 32px)); margin: 36px auto; padding: 72px 88px 96px; background: var(--paper); box-shadow: 0 16px 42px #534a3a2b; }
      header { border-bottom: 2px solid var(--ink); margin-bottom: 46px; padding-bottom: 26px; }
      .eyebrow { margin: 0 0 12px; color: var(--accent); font: 600 12px/1.2 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
      h1, h2, h3, h4 { color: var(--ink); font-weight: 700; line-height: 1.35; }
      h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); letter-spacing: .03em; }
      h2 { margin: 54px 0 20px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 28px; }
      h3 { margin: 34px 0 14px; font-size: 22px; }
      h4 { margin: 28px 0 10px; font-size: 18px; }
      p { margin: 0 0 19px; }
      a { color: var(--accent); text-decoration-color: #9bb3c2; text-underline-offset: 3px; }
      strong { color: var(--ink); } code { padding: 2px 5px; border-radius: 3px; background: #eee6d5; color: #7a2f1d; font: .88em/1.5 Consolas, monospace; }
      pre { overflow: auto; margin: 24px 0; padding: 20px 22px; background: #122d46; color: #f7f1e7; border-left: 4px solid #c89d55; font: 14px/1.65 Consolas, monospace; } pre code { padding: 0; background: transparent; color: inherit; }
      blockquote { margin: 26px 0; padding: 8px 24px; border-left: 3px solid #c89d55; color: #5c594f; }
      ul, ol { margin: 0 0 22px; padding-left: 1.45em; } li { margin: 7px 0; }
      table { display: block; overflow-x: auto; width: 100%; margin: 26px 0; border-collapse: collapse; font-size: .92em; } th { color: var(--ink); background: #e9e2d4; font-weight: 700; } th, td { min-width: 110px; padding: 11px 14px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
      hr { height: 1px; margin: 44px 0; border: 0; background: var(--line); }
      .loading, .error { color: var(--muted); font-style: italic; }
      @media print { body { background: #fff; } .sheet { width: auto; margin: 0; padding: 20mm 18mm; box-shadow: none; } a { color: inherit; text-decoration: none; } }
      @media (max-width: 620px) { .sheet { width: 100%; margin: 0; padding: 40px 24px 64px; } }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header><p class="eyebrow">Technical Documentation</p><h1 id="document-title">技术文档</h1></header>
      <article id="content"><p class="loading">正在载入文档…</p></article>
    </main>
    <script>
      const escapeHtml = (value) => value.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      const inline = (value) => escapeHtml(value).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\[([^\]]+)\]\(([^ )]+)\)/g, '<a href="$2">$1</a>');
      const markdown = (source) => {
        const lines = source.replace(/\r/g, '').split('\n'); let html = ''; let list = null; let code = false; let codeLines = [];
        const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
        for (let i = 0; i < lines.length; i += 1) { const line = lines[i];
          if (line.startsWith('```')) { if (code) { html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`; code = false; codeLines = []; } else { closeList(); code = true; } continue; }
          if (code) { codeLines.push(line); continue; }
          const heading = line.match(/^(#{1,4})\s+(.+)$/); if (heading) { closeList(); const n = heading[1].length; html += `<h${n}>${inline(heading[2])}</h${n}>`; continue; }
          if (/^\s*[-*_]{3,}\s*$/.test(line)) { closeList(); html += '<hr>'; continue; }
          if (line.startsWith('> ')) { closeList(); html += `<blockquote><p>${inline(line.slice(2))}</p></blockquote>`; continue; }
          const item = line.match(/^(\s*)[-*+]\s+(.+)$/); const numbered = line.match(/^\s*\d+\.\s+(.+)$/); if (item || numbered) { const tag = numbered ? 'ol' : 'ul'; if (list !== tag) { closeList(); list = tag; html += `<${tag}>`; } html += `<li>${inline((item ? item[2] : numbered[1]))}</li>`; continue; }
          if (line.includes('|') && lines[i + 1] && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) { closeList(); const cells = line.split('|').filter((_, index, all) => index && index < all.length - 1).map((cell) => `<th>${inline(cell.trim())}</th>`).join(''); html += `<table><thead><tr>${cells}</tr></thead><tbody>`; i += 1; while (lines[i + 1] && lines[i + 1].includes('|')) { i += 1; const row = lines[i].split('|').filter((_, index, all) => index && index < all.length - 1).map((cell) => `<td>${inline(cell.trim())}</td>`).join(''); html += `<tr>${row}</tr>`; } html += '</tbody></table>'; continue; }
          if (!line.trim()) { closeList(); continue; } closeList(); html += `<p>${inline(line)}</p>`;
        } if (code) html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`; closeList(); return html;
      };
      fetch('./技术文档.md').then((response) => { if (!response.ok) throw new Error('无法读取技术文档'); return response.text(); }).then((text) => { const title = text.match(/^#\s+(.+)$/m); if (title) { document.title = title[1]; document.querySelector('#document-title').textContent = title[1]; } document.querySelector('#content').innerHTML = markdown(text.replace(/^#\s+.+\n?/, '')); }).catch((error) => { document.querySelector('#content').innerHTML = `<p class="error">${error.message}。请通过本地服务器打开此文件。</p>`; });
    </script>
  </body>
</html>
